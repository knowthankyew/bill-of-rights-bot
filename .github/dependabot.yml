version: 2
updates:
  # npm Dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "knowthankyew"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Prevent breaking compiler migrations
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "knowthankyew"
    groups:
      github-actions:
        patterns:
          - "*"
